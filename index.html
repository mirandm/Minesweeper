<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <select id="difficulty" aria-label="Difficulty">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="expert">Expert</option>
      </select>
      <button id="mode" class="mode" type="button" aria-pressed="false" title="Tap mode: open or flag">
        <span class="mode-icon" aria-hidden="true">⛏️</span><span class="mode-label">Dig</span>
      </button>
    </header>

    <section class="panel">
      <div class="counter" id="mines" aria-label="Mines left">010</div>
      <button id="face" class="face" type="button" aria-label="New game">🙂</button>
      <div class="counter" id="timer" aria-label="Time">000</div>
    </section>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board" role="grid" aria-label="Minefield"></div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <footer class="help">
      <p><strong>Desktop:</strong> click to open · right-click to flag · click a number to open its neighbours</p>
      <p><strong>Mobile:</strong> tap to open · long-press to flag · or switch the ⛏️/🚩 toggle</p>
      <p id="best" class="best"></p>
    </footer>
  </main>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
